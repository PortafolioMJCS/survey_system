<div class="modal-overlay" (click)="cancel()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    
    <div class="modal-header">
      <h3>Registrar Colaborador</h3>
      <button type="button" class="btn-close" (click)="cancel()">✕</button>
    </div>

    <form [formGroup]="collaboratorForm" (ngSubmit)="submitCollaborator()" autocomplete="off">
      
      <!-- Mensaje de error general -->
      <div class="alert-error" *ngIf="errorMessage()">
        {{ errorMessage() }}
      </div>

      <div class="form-group">
        <label for="name">Nombre Completo</label>
        <input 
          id="name" 
          type="text" 
          formControlName="name" 
          placeholder="Ej. Juan Pérez"
        />
        <span class="error-msg" *ngIf="name?.invalid && name?.touched">
          El nombre es obligatorio (mínimo 3 caracteres).
        </span>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="correo@ejemplo.com"
          autocomplete="off"
        />
        <span class="error-msg" *ngIf="email?.invalid && email?.touched">
          Ingresa un correo electrónico válido.
        </span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña Inicial</label>
        <div class="password-input-wrapper">
          <input 
            id="password" 
            [type]="showPassword() ? 'text' : 'password'" 
            formControlName="password" 
            placeholder="••••••••"
            autocomplete="new-password"
          />
          <button 
            type="button" 
            class="btn-toggle-password" 
            (click)="togglePasswordVisibility()"
            title="Mostrar / ocultar contraseña"
            tabindex="-1">
            <span *ngIf="!showPassword()">👁️</span>
            <span *ngIf="showPassword()">🙈</span>
          </button>
        </div>
        <span class="error-msg" *ngIf="password?.invalid && password?.touched">
          La contraseña debe tener al menos 6 caracteres.
        </span>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="cancel()">Cancelar</button>
        <button 
          type="submit" 
          class="btn-submit" 
          [disabled]="collaboratorForm.invalid || isLoading()">
          {{ isLoading() ? 'Guardando...' : 'Guardar' }}
        </button>
      </div>

    </form>
  </div>
</div>
