<div class="login-container">
  <div class="login-card">
    <div class="brand-header">
      <div class="logo-icon">S</div>
      <h1>Bienvenido</h1>
      <p>Ingresa a tu cuenta para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="ejemplo@correo.com"
        />
        <div class="error-msg" *ngIf="email?.invalid && email?.touched">
          Ingresa un correo válido.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-input-wrapper">
          <input 
            id="password" 
            [type]="showPassword() ? 'text' : 'password'" 
            formControlName="password" 
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button 
            type="button" 
            class="btn-toggle-password" 
            (click)="togglePasswordVisibility()"
            title="Mostrar / ocultar contraseña"
            tabindex="-1">
            <span *ngIf="!showPassword()">👁️</span>
            <span *ngIf="showPassword()">🙈</span>
          </button>
        </div>
        <div class="error-msg" *ngIf="password?.invalid && password?.touched">
          La contraseña es obligatoria.
        </div>
      </div>

      <!-- Botón bloqueado por formulario inválido O petición en curso -->
      <button 
        type="submit" 
        class="btn-submit" 
        [disabled]="loginForm.invalid || isLoading()">
        <span *ngIf="!isLoading()">Iniciar Sesión</span>
        <span *ngIf="isLoading()" class="spinner-container">
          <span class="spinner"></span> Procesando...
        </span>
      </button>
    </form>
  </div>
</div>
